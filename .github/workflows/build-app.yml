name: Build App

on:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
      build_normal_ipa:
        required: true
        type: boolean
      build_trollstore_tipa:
        required: true
        type: boolean
      build_jailbroken_ipa:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  app:
    name: App ${{ inputs.variant }}
    runs-on: macos-26
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: buildcache-idevice
      SCCACHE_C_CUSTOM_CACHE_BUSTER: buildcache-idevice
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive support/idevice
          git submodule update --init --depth 1 engine/firefox

      - name: Update Gecko source
        run: ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Hash Rust toolchain for cache
        id: rust_toolchain
        run: echo "hash=$(rustc -Vv | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Gecko build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
            engine/firefox/.cargo
            engine/firefox/obj-aarch64-apple-ios
          key: buildcache-gecko-${{ inputs.variant }}-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('engine/release.txt', 'patches/**/*.patch', 'tools/development/build-gecko.sh') }}
          restore-keys: |
            buildcache-gecko-${{ inputs.variant }}-${{ steps.rust_toolchain.outputs.hash }}-

      - name: Restore idevice build cache
        uses: actions/cache@v4
        with:
          path: |
            support/idevice/target
            browser/Reynard/JIT/RPPairing/libidevice_ffi.a
          key: buildcache-idevice-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('support/idevice/Cargo.lock', 'support/idevice/Cargo.toml', 'tools/development/build-idevice.sh') }}
          restore-keys: |
            buildcache-idevice-${{ steps.rust_toolchain.outputs.hash }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build idevice support library
        run: ./tools/development/build-idevice.sh

      - name: Install packaging dependencies
        run: brew install ldid

      - name: Build app
        run: ./tools/release/build-app.sh --no-signing

      - name: Create IPA
        if: inputs.build_normal_ipa
        run: ./tools/release/create-ipa.sh

      - name: Create TrollStore TIPA
        if: inputs.build_trollstore_tipa
        run: ./tools/release/create-ipa.sh --trollstore

      - name: Create Jailbroken IPA
        if: inputs.build_jailbroken_ipa
        run: ./tools/release/create-ipa.sh --jailbroken

      - name: Upload IPA
        if: inputs.build_normal_ipa
        uses: actions/upload-artifact@v4
        with:
          name: Reynard.ipa
          path: dist/Reynard.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload TrollStore TIPA
        if: inputs.build_trollstore_tipa
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-TrollStore.tipa
          path: dist/Reynard-TrollStore.tipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Jailbroken IPA
        if: inputs.build_jailbroken_ipa
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-Jailbroken.ipa
          path: dist/Reynard-Jailbroken.ipa
          if-no-files-found: error
          retention-days: 14
